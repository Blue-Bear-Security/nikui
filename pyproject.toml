[project]
name = "nikui"
version = "1.0.0"
description = "A bear-powered code smell and technical debt analyzer with hotspot prioritization and two-tier duplication detection (Simhash + Ollama)."
authors = [
    { name = "amir shaked" }
]
requires-python = ">=3.13"
dependencies = [
    "requests>=2.31.0",
    "flake8>=7.0.0",
    "simhash>=2.1.2",
]

[project.scripts]
nikui = "nikui.nikui:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "black>=26.3.0",
    "pytest>=9.0.2",
]
